<div class="ornament reveal" style="--delay:.4s" aria-hidden="true">
  ❦
</div>

<h2 class="names reveal" style="--delay:.8s">
  <span id="groom"></span>
  <span class="amp">և</span>
  <span id="bride"></span>
</h2>

<p class="intro reveal" style="--delay:1.5s">
  Սիրով հրավիրում ենք ձեզ<br>
  կիսելու մեր կյանքի ամենագեղեցիկ օրը։
</p>

<div class="reveal" style="--delay:2.1s">
  <p class="date" id="date"></p>
  <p class="time" id="time"></p>
</div>

<div class="divider reveal" style="--delay:2.5s"></div>

<div class="reveal" style="--delay:2.8s">
  <h3 class="venue" id="venue"></h3>
  <p class="address" id="address"></p>
  <a class="secondary" id="map" target="_blank"
     rel="noopener noreferrer" hidden>
    Ինչպես հասնել ↗
  </a>
</div>

<div class="reveal" style="--delay:3.5s">
  <div class="divider"></div>
  <p id="countLabel">Մեր օրվան մնացել է</p>

  <div class="countdown" id="countdown" role="group"
       aria-label="Միջոցառմանը մնացած ժամանակը">
    <div class="unit">
      <strong id="days">—</strong><span>օր</span>
    </div>
    <div class="unit">
      <strong id="hours">—</strong><span>ժամ</span>
    </div>
    <div class="unit">
      <strong id="minutes">—</strong><span>րոպե</span>
    </div>
    <div class="unit">
      <strong id="seconds">—</strong><span>վայրկյան</span>
    </div>
  </div>
</div>

<p class="closing reveal" style="--delay:4s">
  Ձեր ներկայությունը<br>կամբողջացնի մեր տոնը։
</p>

<div class="ornament reveal" style="--delay:4.4s" aria-hidden="true">
  ♡
</div>
